<!--
  The toolbar icon is the book cover in miniature: the same vermilion field the
  popup and generateCoverJpeg() paint, with a right-aligned two-line title block
  and the source rule beneath it. Solid bars (not a drawn glyph) is what keeps it
  legible at 16px, where the previous artwork collapsed into a smudge.
  Regenerate the PNGs with:  cd server && node gen-icons.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="16" fill="#CB3F28"/>
  <g fill="#F7F2E7">
    <rect x="28" y="38" width="72" height="16" rx="2"/>
    <rect x="52" y="64" width="48" height="16" rx="2"/>
    <rect x="28" y="96" width="72" height="6" rx="3" opacity="0.55"/>
  </g>
</svg>
