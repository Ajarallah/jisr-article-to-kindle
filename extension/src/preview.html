<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>معاينة قبل الإرسال · جسر</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="progress.css" />
  <link rel="stylesheet" href="preview.css" />
</head>
<body>
  <header class="bar grain">
    <div class="bar-start">
      <span class="wordmark">جسر</span>
      <span class="bar-title">معاينة قبل الإرسال</span>
      <span id="dirBadge" class="dir-badge"></span>
    </div>
    <div class="bar-actions" id="actions">
      <button id="downloadBtn" class="btn ghost">تنزيل EPUB</button>
      <button id="sendBtn" class="btn primary">إرسال إلى كندل</button>
    </div>
  </header>

  <div id="status" class="status hidden" role="status" aria-live="polite" aria-atomic="true"></div>

  <main class="stage">
    <iframe id="preview" title="معاينة المحتوى" sandbox=""></iframe>
  </main>

  <script type="module" src="preview.js"></script>
</body>
</html>
