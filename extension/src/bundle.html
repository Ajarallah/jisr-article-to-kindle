<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جسر · قائمة القراءة</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="motion.css" />
  <link rel="stylesheet" href="progress.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <header class="masthead grain">
    <div class="masthead-inner">
      <div class="kicker"><span class="wordmark">جسر</span><span>قائمة القراءة</span></div>
      <h1>عدّة مقالات، كتابٌ واحد</h1>
      <p class="lede">فصلٌ لكلّ مقال، وفهرسٌ يجمعها</p>
    </div>
  </header>

  <div class="wrap">

    <section class="panel">
      <p class="hint">
        اجمع عدّة مقالات في <strong>كتابٍ واحد</strong> يُرسَل إلى كندل بفصلٍ لكلّ مقال.
        أضِف المقالات من زرّ «أضِف للقائمة» في الإضافة، ثمّ ابنِ الكتاب هنا.
      </p>
      <ul id="listItems" class="history"></ul>
      <div class="actions" id="actions" style="margin-top:14px; gap:10px; flex-wrap:wrap">
        <button id="sendBtn" class="btn primary" disabled>ابنِ وأرسِل الكتاب</button>
        <button id="downloadBtn" class="btn ghost" disabled>نزّل الكتاب (EPUB)</button>
        <button id="clearBtn" class="btn ghost" disabled>امسح القائمة</button>
      </div>
      <div id="status" class="status hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    </section>
  </div>
  <script src="../lib/jszip.min.js"></script>
  <script type="module" src="bundle.js"></script>
</body>
</html>
