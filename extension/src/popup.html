<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <span class="mark">A2K</span>
    <span class="app-name">Article to Kindle</span>
    <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
  </header>

  <main>
    <section id="articleCard" class="card">
      <div id="articleTitle" class="title skeleton">Reading page…</div>
      <div id="articleMeta" class="meta"></div>
    </section>

    <section class="card">
      <label class="row toggle-row">
        <input type="checkbox" id="translateToggle" />
        <span>Translate before sending</span>
      </label>
      <div id="translateOptions" class="translate-options hidden">
        <label class="field">
          <span class="field-label">Into</span>
          <select id="targetLang">
            <option value="Arabic">Arabic — العربية</option>
            <option value="English">English</option>
            <option value="French">French</option>
            <option value="Spanish">Spanish</option>
            <option value="German">German</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card kindle-row">
      <div class="field">
        <span class="field-label">Send to</span>
        <span id="kindleEmail" class="kindle-email">not set</span>
      </div>
    </section>

    <div class="actions">
      <button id="sendBtn" class="btn primary" disabled>Send to Kindle</button>
      <button id="downloadBtn" class="btn ghost" disabled>Download EPUB</button>
    </div>

    <div id="status" class="status hidden"></div>
  </main>

  <script src="../lib/jszip.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
