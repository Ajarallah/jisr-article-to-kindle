<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <span class="brand-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5.5A2 2 0 0 1 5 3.5h5v16.5H5a2 2 0 0 0-2 2V5.5z" />
        <path d="M21 5.5a2 2 0 0 0-2-2h-5v16.5h5a2 2 0 0 1 2 2V5.5z" />
      </svg>
    </span>
    <span class="app-name"><span style="background:linear-gradient(transparent 55%, var(--lime) 55%);padding:0 4px;border-radius:2px;">جسر</span></span>
    <button id="settingsBtn" class="icon-btn" title="الإعدادات" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </header>

  <main>
    <section id="articleCard" class="card article-card">
      <div id="articleTitle" class="title skeleton">جارٍ قراءة الصفحة…</div>
      <div id="articleMeta" class="meta"></div>
    </section>

    <section class="card">
      <label class="switch-row">
        <span class="switch-label">ترجمة المقال قبل الإرسال</span>
        <span class="switch">
          <input type="checkbox" id="translateToggle" />
          <span class="track"><span class="thumb"></span></span>
        </span>
      </label>
      <div id="translateOptions" class="translate-options hidden">
        <label class="field">
          <span class="field-label">إلى</span>
          <select id="targetLang">
            <option value="Arabic">العربية</option>
            <option value="English">الإنجليزية</option>
            <option value="French">الفرنسية</option>
            <option value="Spanish">الإسبانية</option>
            <option value="German">الألمانية</option>
          </select>
        </label>
      </div>
    </section>

    <section class="card kindle-row">
      <div class="field">
        <span class="field-label">الوجهة</span>
        <span id="deliveryInfo" class="kindle-email">…</span>
      </div>
    </section>

    <div class="actions">
      <button id="sendBtn" class="btn primary" disabled>إرسال إلى كندل</button>
      <button id="downloadBtn" class="btn ghost" disabled>تنزيل EPUB</button>
    </div>

    <div id="status" class="status hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <div style="text-align:center; margin-top:12px; display:flex; gap:16px; justify-content:center;">
      <button id="previewBtn" style="background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;font-size:12.5px;text-decoration:underline;padding:4px;">معاينة قبل الإرسال</button>
      <button id="fileBtn" style="background:none;border:none;color:var(--accent);font:inherit;cursor:pointer;font-size:12.5px;text-decoration:underline;padding:4px;">ملف md / docx</button>
    </div>
  </main>

  <script src="../lib/jszip.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
