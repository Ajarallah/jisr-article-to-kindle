<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="progress.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!--
    The cover block is a live preview of the EPUB cover generateCoverJpeg() will
    paint — same ink, same title/source layout. Editing the title here edits the
    cover, which is the whole point of the direction.
  -->
  <header class="cover grain">
    <div class="cover-top">
      <span class="wordmark">جسر</span>
      <span class="cover-kicker">غلاف الكتاب</span>
      <button id="settingsBtn" class="icon-btn" title="الإعدادات" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
    </div>
    <div id="articleTitle" class="title skeleton">جارٍ قراءة الصفحة…</div>
    <div id="articleMeta" class="meta"></div>
    <input id="authorInput" class="author-input hidden" type="text" placeholder="الكاتب (اختياري)" />
  </header>

  <main>
    <section class="sheet">
      <div class="sheet-head">التحويل</div>
      <label class="switch-row hidden" id="selectionRow">
        <span class="switch-label" id="selectionLabel">أرسل التحديد فقط</span>
        <span class="switch">
          <input type="checkbox" id="selectionToggle" />
          <span class="track"><span class="thumb"></span></span>
        </span>
      </label>
      <label class="switch-row">
        <span class="switch-label"><svg class="opt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5 H12"/><path d="M8 3 V5"/><path d="M6 5 C6 9 8.5 12 12 13"/><path d="M10.5 8.5 C8.5 11 6 12.5 4 13"/><path d="M13 20 L17 10 L21 20"/><path d="M14.3 17 H19.7"/></svg>ترجمة المقال قبل الإرسال</span>
        <span class="switch">
          <input type="checkbox" id="translateToggle" />
          <span class="track"><span class="thumb"></span></span>
        </span>
      </label>
      <div id="translateOptions" class="translate-options hidden">
        <label class="field">
          <span class="field-label"><svg class="opt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12 H21"/><path d="M12 3 C15 6 15 18 12 21 C9 18 9 6 12 3"/></svg>إلى</span>
          <select id="targetLang">
            <option value="Arabic">العربية</option>
            <option value="English">الإنجليزية</option>
            <option value="French">الفرنسية</option>
            <option value="Spanish">الإسبانية</option>
            <option value="German">الألمانية</option>
          </select>
        </label>
        <label class="switch-row">
          <span class="switch-label"><svg class="opt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="7.5" height="16" rx="1.5"/><rect x="13" y="4" width="7.5" height="16" rx="1.5"/></svg>وضع ثنائي اللغة (الأصل + الترجمة)</span>
          <span class="switch">
            <input type="checkbox" id="bilingualToggle" />
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
        <label class="switch-row">
          <span class="switch-label"><svg class="opt-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4 H16 A2 2 0 0 1 18 6 V21 L12 17.5 L6 21 Z"/><path d="M9.5 9 H14.5"/><path d="M9.5 12.5 H13"/></svg>مسرد دراسي (شرح المصطلحات الصعبة كحواشٍ)</span>
          <span class="switch">
            <input type="checkbox" id="glossaryToggle" />
            <span class="track"><span class="thumb"></span></span>
          </span>
        </label>
      </div>
    </section>

    <section class="sheet kindle-row">
      <span class="field-label">الوجهة</span>
      <span id="deliveryInfo" class="kindle-email">…</span>
    </section>

    <div class="actions" id="actions">
      <button id="sendBtn" class="btn primary" disabled>إرسال إلى كندل</button>
      <button id="downloadBtn" class="btn ghost" disabled>تنزيل</button>
    </div>


    <div id="status" class="status hidden" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="tools">
      <button id="previewBtn" class="tool-link">معاينة</button>
      <button id="addListBtn" class="tool-link">أضِف للقائمة</button>
      <button id="pickBtn" class="tool-link">اختر منطقة</button>
      <button id="bundleBtn" class="tool-link">قائمة القراءة</button>
      <button id="fileBtn" class="tool-link">ملف</button>
    </div>
    <div class="fallback-note">
      <a href="https://www.amazon.com/sendtokindle" target="_blank" rel="noreferrer">لا يعمل الإرسال؟ نزّل EPUB واستخدم Send to Kindle الرسمي ←</a>
    </div>
  </main>

  <script src="../lib/jszip.min.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
